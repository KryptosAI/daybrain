<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#fff;color:#202124;height:100vh;display:flex;flex-direction:column}
.top{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-bottom:120px}
.top .greeting{font-size:24px;color:#202124;margin-bottom:4px;font-weight:400}
.top .subtitle{color:#5f6368;font-size:14px}
.chatbar{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);width:680px;background:#fff;border:1px solid #dadce0;border-radius:24px;padding:8px 16px;display:flex;align-items:center;gap:8px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.chatbar input{flex:1;border:none;outline:none;font-size:15px;color:#202124}
.chatbar input::placeholder{color:#80868b}
.send{color:#1a73e8;font-size:15px;cursor:pointer;font-weight:500;padding:4px 8px;border-radius:8px}
.send:hover{background:#f1f3f4}
.ctx-btn{background:transparent;border:none;cursor:pointer;font-size:13px;color:#80868b;font-weight:500;padding:4px 10px;border-radius:16px;transition:all .15s;white-space:nowrap}
.ctx-btn:hover{background:#f1f3f4;color:#202124}
</style></head><body>

<div class="top">
  <div class="greeting">Good afternoon</div>
  <div class="subtitle">How can Claude help you today?</div>
</div>

<div class="chatbar">
  <button class="ctx-btn">Context</button>
  <input placeholder="Ask anything…">
  <span class="send">Send</span>
</div>
</body></html>
