<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 300px; padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px; background: #fff; color: #202124;
    }
    .header { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
    .header img { width: 32px; height: 32px; border-radius: 7px; }
    .header .title { font-weight: 500; font-size: 15px; }
    .header .sub { font-size: 10px; color: #80868b; }
    .card { background: #f8f9fa; border-radius: 10px; padding: 12px; margin-bottom: 8px; }
    .card .nums { display: flex; gap: 16px; }
    .card .nums .n { font-size: 20px; font-weight: 500; color: #1a73e8; line-height: 1; }
    .card .nums .l { font-size: 10px; color: #5f6368; margin-top: 2px; }
    .section { font-size: 10px; font-weight: 500; color: #5f6368; letter-spacing: .3px; margin: 10px 0 4px; }
    .app-row { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 2px; color: #5f6368; }
    .app-row span:last-child { font-weight: 500; color: #202124; }
    .insight { font-size: 11px; padding: 8px 10px; background: #f8f9fa; border-radius: 8px; margin-bottom: 4px; line-height: 1.4; }
    .insight .t { font-weight: 500; }
    .insight .d { color: #5f6368; font-size: 10px; }
    .pill { display: inline-block; background: #e8f0fe; color: #1a73e8; font-size: 9px; font-weight: 500; padding: 1px 4px; border-radius: 5px; margin-left: 4px; }
    .row { display: flex; gap: 8px; margin-top: 8px; }
    .btn {
      flex: 1; padding: 7px; border: none; border-radius: 8px; font-size: 12px; font-weight: 500;
      cursor: pointer; text-align: center; background: #1a73e8; color: white;
    }
    .btn:hover { box-shadow: 0 1px 3px rgba(0,0,0,.12), 0 2px 6px rgba(26,115,232,.25); }
    .btn.outline { background: transparent; color: #1a73e8; border: 1px solid #dadce0; }
    .btn.outline:hover { background: #f1f3f4; box-shadow: none; }
    .btn.danger { background: transparent; color: #5f6368; border: 1px solid #dadce0; }
    .btn.danger:hover { background: #f1f3f4; }
    .empty { text-align: center; padding: 24px 0; color: #80868b; font-size: 13px; }
    .rec { display: flex; align-items: center; gap: 5px; font-size: 11px; color: #5f6368; margin-bottom: 10px; }
    .rec .dot { width: 6px; height: 6px; border-radius: 50%; background: #34a853; }
  </style>
</head>
<body>
  <div class="header">
    <img src="icons/icon48.png" alt="">
    <div>
      <div class="title">DayBrain</div>
      <div class="sub">Your day, in context</div>
    </div>
  </div>

  <div class="rec"><span class="dot" id="rec-dot"></span> <span id="rec-label">Recording</span></div>

  <div id="content"><div class="empty">Loading…</div></div>

  <div class="row" id="actions" style="display:none">
    <button class="btn outline" id="refresh-btn">Refresh</button>
    <button class="btn danger" id="pause-btn">Pause</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
