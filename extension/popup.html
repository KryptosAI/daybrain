<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px; padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      background: #1a1a2e; color: #e0e0e0;
    }
    h2 { font-size: 16px; margin-bottom: 12px; }
    .stat { padding: 10px; background: #222; border-radius: 8px; margin-bottom: 8px; }
    .stat-label { font-size: 11px; color: #888; }
    .stat-value { font-size: 22px; font-weight: 700; margin-top: 2px; }
    .insight { padding: 8px; background: #222; border-radius: 6px; margin-bottom: 6px; font-size: 12px; }
    .btn {
      width: 100%; padding: 10px; border: none; border-radius: 8px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white; font-weight: 600; font-size: 14px; cursor: pointer;
      margin-top: 12px;
    }
    .btn-small {
      padding: 6px 12px; border: 1px solid #444; border-radius: 6px;
      background: transparent; color: #ccc; font-size: 11px; cursor: pointer;
      margin-top: 4px;
    }
    .err { color: #e74c3c; text-align: center; padding: 20px 0; }
    .loading { text-align: center; color: #888; padding: 20px 0; }
    input {
      width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #444;
      background: #222; color: #e0e0e0; font-size: 12px; margin-bottom: 8px;
      font-family: monospace;
    }
    label { font-size: 11px; color: #888; display: block; margin-bottom: 4px; margin-top: 8px; }
    .settings-section { border-top: 1px solid #333; margin-top: 12px; padding-top: 12px; display: none; }
    .settings-section.visible { display: block; }
  </style>
</head>
<body>
  <h2>🧠 DayBrain</h2>
  <div id="stats"><div class="loading">Loading...</div></div>
  <button class="btn" id="open-sidebar">Open Sidebar</button>
  <button class="btn-small" id="toggle-settings" style="width:100%;margin-top:8px;">⚙ Settings</button>
  <div class="settings-section" id="settings">
    <label>Sync URL (for cross-device):</label>
    <input type="text" id="sync-url" placeholder="http://192.168.1.100:19840" />
    <button class="btn-small" id="save-sync" style="width:100%;">Save Sync URL</button>
    <div style="font-size:10px;color:#666;margin-top:6px;">
      Leave blank to use localhost. Set to another DayBrain server's IP to sync across devices.
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
