<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:280px;padding:14px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:13px;background:#fff;color:#202124}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.top .brand{display:flex;align-items:center;gap:8px}
.top img{width:28px;height:28px;border-radius:6px}
.top .name{font-weight:500;font-size:14px}

.toggle{display:flex;align-items:center;gap:10px;padding:12px;background:#f8f9fa;border-radius:10px;margin-bottom:12px}
.toggle .label{font-size:12px;color:#5f6368}
.toggle .state{font-size:16px;font-weight:500}
.switch{position:relative;width:44px;height:24px;flex-shrink:0}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background:#dadce0;border-radius:12px;transition:.2s}
.slider:before{position:absolute;content:"";height:18px;width:18px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.2s}
input:checked+.slider{background:#34a853}
input:checked+.slider:before{transform:translateX(20px)}

.stats{display:flex;gap:8px;margin-bottom:12px}
.stat{flex:1;background:#f8f9fa;border-radius:8px;padding:8px;text-align:center}
.stat .v{font-size:18px;font-weight:500;color:#1a73e8;line-height:1}
.stat .l{font-size:10px;color:#5f6368;margin-top:2px}

.ins{font-size:11px;padding:8px;background:#f8f9fa;border-radius:8px;margin-bottom:4px;line-height:1.4}
.ins .t{font-weight:500}
.ins .d{color:#5f6368;font-size:10px}
.pill{display:inline-block;background:#e8f0fe;color:#1a73e8;font-size:9px;font-weight:500;padding:1px 4px;border-radius:5px;margin-left:4px}

.btn{display:block;width:100%;padding:9px;border:none;border-radius:8px;background:#1a73e8;color:#fff;font-size:13px;font-weight:500;cursor:pointer;text-align:center;margin-top:8px;transition:box-shadow .15s}
.btn:hover{box-shadow:0 1px 3px rgba(0,0,0,.12),0 2px 6px rgba(26,115,232,.25)}
.btn.secondary{background:transparent;color:#1a73e8;margin-top:4px;font-size:12px}
.btn.secondary:hover{background:#f1f3f4;box-shadow:none}

.section{font-size:10px;font-weight:500;color:#5f6368;letter-spacing:.3px;margin:4px 0 4px}
.app{display:flex;justify-content:space-between;font-size:11px;color:#5f6368;margin-bottom:1px}
.app span:last-child{font-weight:500;color:#202124}

.empty{text-align:center;padding:20px 0;color:#80868b;font-size:12px}
.toast{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);background:#202124;color:#fff;padding:6px 14px;border-radius:6px;font-size:11px;transition:opacity .3s}
</style></head><body>

<div class="top">
  <div class="brand"><img src="icons/icon48.png"><span class="name">DayBrain</span></div>
</div>

<div class="toggle">
  <label class="switch"><input type="checkbox" id="rec-toggle" checked><span class="slider"></span></label>
  <div>
    <div class="state" id="rec-state">Recording</div>
    <div class="label">activity & commitments</div>
  </div>
</div>

<div id="content"><div class="empty">Loading…</div></div>
<div id="actions" style="display:none">
  <button class="btn" id="copy-btn">Copy context</button>
  <button class="btn secondary" id="refresh-btn">Refresh</button>
</div>

<script src="popup.js"></script>
</body></html>
